<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sealShine" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F1EB"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C08A4E"/>
      <stop offset="100%" stop-color="#8A5F2E"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="57" fill="url(#sealShine)" stroke="#16283D" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#16283D" stroke-width="0.75" opacity="0.35"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="1.4"/>

  <!-- fine tick ring, like a stamped instrument -->
  <g stroke="#16283D" stroke-width="0.9" opacity="0.55">
    <line x1="60" y1="10" x2="60" y2="16"/>
    <line x1="60" y1="104" x2="60" y2="110"/>
    <line x1="10" y1="60" x2="16" y2="60"/>
    <line x1="104" y1="60" x2="110" y2="60"/>
    <line x1="26.5" y1="26.5" x2="30.7" y2="30.7"/>
    <line x1="89.3" y1="89.3" x2="93.5" y2="93.5"/>
    <line x1="26.5" y1="93.5" x2="30.7" y2="89.3"/>
    <line x1="89.3" y1="30.7" x2="93.5" y2="26.5"/>
  </g>
  <g stroke="#16283D" stroke-width="0.5" opacity="0.3">
    <line x1="60" y1="16" x2="60" y2="20"/>
    <line x1="60" y1="100" x2="60" y2="104"/>
    <line x1="16" y1="60" x2="20" y2="60"/>
    <line x1="100" y1="60" x2="104" y2="60"/>
  </g>

  <!-- monogram -->
  <text x="60" y="57" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="30" fill="#16283D" text-anchor="middle" letter-spacing="0.5">TB</text>

  <!-- route underline with brass endpoints -->
  <line x1="32" y1="72" x2="88" y2="72" stroke="url(#ringGrad)" stroke-width="1.2" stroke-dasharray="1.4 4.2" stroke-linecap="round"/>
  <circle cx="32" cy="72" r="2.6" fill="#16283D"/>
  <circle cx="88" cy="72" r="2.6" fill="#16283D"/>

  <text x="60" y="88" font-family="IBM Plex Mono, monospace" font-size="7" letter-spacing="2.5" fill="#8A5F2E" text-anchor="middle">EST. 2026</text>
</svg>
