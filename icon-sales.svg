<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="salesBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#16283D"/>
      <stop offset="100%" stop-color="#2B3F55"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="6" fill="#FFFFFF" stroke="#D8D3C7" stroke-width="1.5"/>

  <!-- baseline grid, subtle -->
  <line x1="10" y1="48" x2="54" y2="48" stroke="#EEEAE0" stroke-width="1"/>
  <line x1="10" y1="38" x2="54" y2="38" stroke="#EEEAE0" stroke-width="1"/>
  <line x1="10" y1="28" x2="54" y2="28" stroke="#EEEAE0" stroke-width="1"/>

  <!-- bars -->
  <rect x="14" y="38" width="7" height="10" rx="1.2" fill="url(#salesBarGrad)" opacity="0.55"/>
  <rect x="26" y="30" width="7" height="18" rx="1.2" fill="url(#salesBarGrad)" opacity="0.75"/>
  <rect x="38" y="20" width="7" height="28" rx="1.2" fill="url(#salesBarGrad)"/>

  <!-- growth line + trend arrow -->
  <polyline points="12,44 25,32 34,36 46,17" fill="none" stroke="#A9763F" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="12" cy="44" r="2.4" fill="#A9763F"/>
  <circle cx="25" cy="32" r="2.4" fill="#A9763F"/>
  <circle cx="34" cy="36" r="2.4" fill="#A9763F"/>
  <path d="M40 17 H46 V23" fill="none" stroke="#A9763F" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <line x1="10" y1="48" x2="54" y2="48" stroke="#16283D" stroke-width="1.4" stroke-linecap="round"/>
</svg>
